<!doctype html>
<meta charset="utf-8" />
<title>便便收藏品美术校样</title>
<style>
  body {
    margin: 0;
    padding: 30px;
    background: #f7f4e9;
    font: 15px system-ui;
    color: #52634e;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 23px;
  }
  p {
    margin: 0 0 26px;
    color: #7c8972;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 190px);
    gap: 18px;
  }
  .card {
    background: #fffdf5;
    border: 1px solid #e4e9d7;
    border-radius: 24px;
    text-align: center;
    padding: 6px 0 16px;
  }
  .card svg {
    width: 190px;
    height: 190px;
    display: block;
  }
  .card strong {
    font-size: 14px;
  }
  .card small {
    display: block;
    font-size: 11px;
    color: #8c9783;
    margin-top: 5px;
  }
</style>
<h1>便便收藏游戏 · 新形态总览</h1>
<p>参考图透明素材与统一树脂光照。<a href="新形态预览.html">打开分组大图预览</a>。</p>
<div class="grid"></div>
<script type="module">
  import { characters } from "../../src/content/specimens.js";
  import {
    characterSvg,
    bristolSvg,
    mysterySvg,
  } from "../../src/ui/artwork/stools.js";
  const prototype = new URLSearchParams(location.search).has("prototype");
  const ids = [
    "classic",
    "pebble",
    "spiral",
    "gold",
    "crystal",
    "jelly",
    "luminous",
    "mashed-potato",
    "jet",
    "rainbow",
  ];
  const chosen = prototype
    ? characters.filter((item) => ids.includes(item.id))
    : characters;
  document.querySelector(".grid").innerHTML = chosen
    .map(
      (item) =>
        `<article class="card">${characterSvg(item)}<strong>${item.name}</strong><small>${item.homeType} 型 · ${item.material}</small></article>`,
    )
    .join("");
  window.previewReady = true;
</script>
