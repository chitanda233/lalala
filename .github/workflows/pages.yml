name: 发布 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 读取代码
        uses: actions/checkout@v6
      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 读取 Pages 配置
        id: pages
        uses: actions/configure-pages@v5
      - name: 构建游戏
        run: node scripts/build.mjs --base-path="$PAGES_BASE_PATH/" --asset-version="$GITHUB_SHA"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: 上传游戏产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: 发布游戏
        id: deployment
        uses: actions/deploy-pages@v4
